<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahayak Automation Success</title>
  <meta name="description" content="Success dashboard verifying completion of Sahayak AI browser automation.">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app-container" id="success-dashboard">
    <div class="card">
      <!-- Success Hero Banner -->
      <header class="success-hero">
        <div class="success-icon-wrapper" aria-hidden="true">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>

        <div class="success-badge">
          <span>● Automation Verified</span>
        </div>

        <!-- Greeting -->
        <h1 class="main-title" id="welcome-heading">
          Welcome, <span id="display-full-name">Arpit Raj</span>!
        </h1>

        <!-- Core Success Message -->
        <div class="success-message-box" role="status" id="success-message-banner">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9 12l2 2 4-4"></path>
          </svg>
          <span id="success-message-text">Sahayak successfully completed the requested automation.</span>
        </div>
      </header>

      <!-- Extracted / Logged User Details -->
      <section class="details-card" aria-label="Automated profile summary">
        <div class="details-row">
          <span class="detail-label">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            First Name
          </span>
          <span class="detail-value" id="display-first-name">Arpit</span>
        </div>

        <div class="details-row">
          <span class="detail-label">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Last Name
          </span>
          <span class="detail-value" id="display-last-name">Raj</span>
        </div>

        <div class="details-row">
          <span class="detail-label">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            Age
          </span>
          <span class="detail-value" id="display-age">20</span>
        </div>

        <div class="details-row">
          <span class="detail-label">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
            State
          </span>
          <span class="detail-value" id="display-state">Bihar</span>
        </div>

        <div class="details-row">
          <span class="detail-label">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            Status
          </span>
          <span class="status-pill">Verified &amp; Logged In</span>
        </div>
      </section>

      <!-- Action Button to re-test -->
      <div class="button-container">
        <button type="button" id="reset-button" class="btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"></polyline>
            <polyline points="23 20 23 14 17 14"></polyline>
            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
          </svg>
          <span>Run Demo Again</span>
        </button>
      </div>
    </div>

    <footer class="footer-text">
      Sahayak AI Browser Automation Engine &copy; 2026
    </footer>
  </main>

  <script src="script.js"></script>
</body>

</html>
